name: Docker Base Image

# ── Trigger: manual only ─────────────────────────────────────────────────────
# The base image installs a pre-compiled llama-cpp-python wheel (built on a
# GPU pod) plus all server dependencies. Rebuild when you:
#   - Upload a new wheel to GitHub Releases (new llama-cpp-python version)
#   - Change requirements-server.txt
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for the base image (e.g. 'latest', 'v1.0.0')"
        required: true
        default: "latest"
      wheel_release_tag:
        description: "GitHub Release tag containing the llama-cpp-python wheel"
        required: true
        default: "base-v1.0.0"

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # No CUDA compilation — just downloading and pip install

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sales-copilot-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama-cpp-python wheel from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download ${{ github.event.inputs.wheel_release_tag }} \
            --pattern "llama_cpp_python*.whl" \
            --dir wheels/
          echo "Downloaded wheel:"
          ls -lh wheels/
          WHEEL_FILE="$(ls wheels/llama_cpp_python*.whl | head -n 1)"
          echo "Wheel filename: ${WHEEL_FILE}"
          if [ -z "${WHEEL_FILE}" ]; then
            echo "No wheel file found after download."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
