name: Docker Base Image

# ── Trigger: manual only ─────────────────────────────────────────────────────
# The base image contains CUDA + llama-cpp-python + faster-whisper and takes
# 30-60 min to build. Only rebuild when you upgrade these dependencies.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for the base image (e.g. 'latest', 'cuda12.8-v1')"
        required: true
        default: "latest"

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # CUDA compilation is slow on 2-core runners

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sales-copilot-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          # Cache layers in GitHub Actions cache to speed up rebuilds.
          # The CUDA compilation layer is cached after the first successful build,
          # so subsequent runs (even with code changes) skip it entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max
