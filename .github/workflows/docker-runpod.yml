name: Docker Publish (RunPod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish"
        required: true
        default: "latest"
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Required repository secrets:
    #   DOCKERHUB_USERNAME
    #   DOCKERHUB_TOKEN
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sales-copilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Push latest tag
        if: ${{ github.event.inputs.push_latest == 'true' && github.event.inputs.image_tag != 'latest' }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"
