name: Docker App Image

# ── Trigger: every push to main, or manual ───────────────────────────────────
# The app image just copies code on top of the pre-built base image.
# No compilation = builds in < 60 seconds. Safe to run on every push.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "config/**"
      - "scripts/**"
      - "docker/Dockerfile"
      - "requirements-server.txt"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish"
        required: true
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # App image builds are fast — no compilation

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sales-copilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
