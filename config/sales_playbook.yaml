# sales_playbook.yaml
# --------------------
# This file defines the AI's knowledge of your product and how to sell it.
# Update these values for your specific company and product before deploying.
# The LLM reads this at startup — no code changes needed to update sales guidance.

product_name: "SalesFlow CRM"

product_description: >
  SalesFlow is an AI-powered CRM platform that helps sales teams close more deals
  by automating follow-ups, tracking pipeline health, and surfacing the right
  insights at the right time. Built for teams of 5 to 500.

value_propositions:
  - "Reduces manual data entry by 70% with automatic call and email logging"
  - "Average customer sees 23% increase in close rate within 90 days"
  - "Integrates with 200+ tools including Salesforce, HubSpot, Slack, and Gmail"
  - "SOC 2 Type II certified — enterprise-grade security"
  - "Dedicated onboarding manager and 24/7 support included in all plans"

tone: "confident, warm, and consultative — never pushy or scripted"

# Common objections and ideal response angles.
# The LLM uses these as guidance, not as scripts to read verbatim.
objection_guidance:
  price:
    summary: "Too expensive"
    angle: >
      Acknowledge the concern, then reframe around ROI. Our average customer
      saves 8 hours per rep per week. At $50/hr that's $20,000/year per rep —
      far exceeding the cost. Offer to walk through an ROI calculation together.

  timing:
    summary: "Not the right time / too busy right now"
    angle: >
      Validate that timing matters. Ask what a better time looks like and what
      needs to change between now and then. Often the real concern is effort
      of switching — address that directly with our white-glove onboarding offer.

  competitor:
    summary: "We already use [competitor]"
    angle: >
      Don't attack the competitor. Ask what they like about it and what they
      wish were better. Focus on the gaps we fill. Offer a side-by-side
      comparison or a free migration assessment.

  complexity:
    summary: "Seems complicated / hard to adopt"
    angle: >
      Agree that adoption is the #1 risk with any new tool. Describe our
      onboarding process: dedicated manager, 2-week guided setup, live training
      for the whole team. Average time to value is 3 weeks.

  authority:
    summary: "I need to check with my manager / team"
    angle: >
      That's expected and healthy. Offer to provide materials they can share
      internally, or ask if it'd be useful to include the decision-maker in
      the next call. Ask what questions their manager is likely to have.

buying_signal_guidance: >
  When the customer shows interest or asks about next steps, move toward
  scheduling a demo or pilot. Don't oversell — match their energy and let
  them lead. Key phrases to act on: "how would we get started", "what does
  implementation look like", "can we try it", "who else uses this".